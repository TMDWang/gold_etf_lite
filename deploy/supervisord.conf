[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/gold-supervisor.pid
user=root

[program:web]
user=appuser
environment=HOME="/home/appuser",USER="appuser"
command=uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2 --no-proxy-headers
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:monitor]
user=appuser
environment=HOME="/home/appuser",USER="appuser"
command=python manage.py monitor
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
