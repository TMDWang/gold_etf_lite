name: gold-etf-lite
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldetf}
      POSTGRES_USER: ${POSTGRES_USER:-goldetf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先生成 .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BACKUP_DIR: /backups
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    ports:
      - "${BIND_IP:-0.0.0.0}:${APP_PORT:-8088}:8000"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
